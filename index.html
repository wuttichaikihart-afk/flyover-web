<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Flyover (GPX Upload)</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #f0f0f0; overflow: hidden; }
        
        /* ให้แผนที่เต็มจอเสมอ วิดีโอจะอัดตามสัดส่วนจอ */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; display: none; }
        
        #upload-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; z-index: 10;
            width: 80%; max-width: 400px;
        }
        
        #controls { 
            display: none; position: absolute; top: 20px; left: 20px; z-index: 10; 
            background: white; padding: 20px; border-radius: 12px; width: 250px; 
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); 
        }
        
        .action-btn {
            background: #2196F3; color: white; padding: 12px 24px; border: none;
            border-radius: 4px; font-size: 16px; font-weight: bold; cursor: pointer;
            margin-top: 15px; width: 100%;
        }
        .action-btn:hover { background: #1976D2; }

        .record-btn { background: #FF5A5F; }
        .record-btn:hover { background: #e04a50; }
        
        .style-selector { margin-top: 15px; padding-top: 15px; border-top: 1px solid #eee; }
        .style-selector label { font-size: 12px; color: #666; display: block; margin-bottom: 5px; }
        .style-selector select { width: 100%; padding: 8px; border-radius: 4px; border: 1px solid #ccc; font-size: 14px; margin-bottom: 10px; }

        /* แผงหน้าปัด ปรับให้รองรับจอมือถือแนวตั้งด้วย */
        #hud {
            display: none; 
            position: absolute; 
            top: 50px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: white; 
            text-align: center;
            font-family: -apple-system, sans-serif;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8), 0px 0px 10px rgba(0,0,0,0.5);
        }
        .hud-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .hud-header p {
            margin: 5px 0 20px 0;
            font-size: 16px;
            font-weight: 600;
        }
        .hud-stats {
            display: flex; 
            justify-content: space-between;
            padding: 0 20px;
        }
        .hud-item { 
            text-align: center; 
            flex: 1; 
        }
        .hud-label { 
            font-size: 13px; 
            font-weight: 700; 
            margin-bottom: 5px; 
        }
        .hud-value { 
            font-size: 38px; 
            font-weight: 900; 
            margin-bottom: 2px;
        }
        .hud-unit { 
            font-size: 14px; 
            font-weight: 700; 
        }
        
        #stop-btn {
            display: none;
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 20;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        #stop-btn:hover {
            background: rgba(220, 40, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ปรับขนาดตัวอักษรบนจอมือถือแนวตั้ง */
        @media (max-width: 600px) {
            #upload-panel { width: 85%; padding: 20px; }
            #controls { top: auto; bottom: 20px; left: 50%; transform: translateX(-50%); width: 90%; gap: 8px; }
            .action-btn { padding: 12px 15px; font-size: 14px; }
            #hud { top: 40px; }
            .hud-header h1 { font-size: 24px; }
            .hud-header p { font-size: 14px; margin-bottom: 15px; }
            .hud-value { font-size: 28px; }
            .hud-label { font-size: 11px; }
            .hud-unit { font-size: 12px; }
            #stop-btn { top: 15px; left: 15px; padding: 8px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="video-modal" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 100; text-align: center; width: 80%; max-width: 350px;">
    <h3 style="margin-top: 0;">🎥 บันทึกวิดีโอสำเร็จ!</h3>
    <p style="font-size: 14px; color: #555;">เลือกสิ่งที่คุณต้องการทำต่อไป</p>
    <button id="btn-share-video" class="action-btn" style="background: #25D366; margin-top: 10px;">📤 แชร์วิดีโอ (Share)</button>
    <button id="btn-save-video" class="action-btn" style="background: #2196F3; margin-top: 10px;">💾 เซฟลงเครื่อง (Save)</button>
    <button id="btn-close-modal" class="action-btn" style="background: #999; margin-top: 10px;">❌ ปิด</button>
</div>

<button id="stop-btn">✕ หยุด / ย้อนกลับ</button>

<div id="upload-panel">
    <h2>อัปโหลดเส้นทางวิ่งของคุณ</h2>
    <p>รองรับไฟล์ .gpx (ส่งออกจาก Garmin Connect ได้เลย)</p>
    <input type="file" id="gpx-input" accept=".gpx">
</div>

<div id="controls">
    <h3 id="run-title" style="margin-top:0;">My Run</h3>
    
    <div class="style-selector">
        <label>ความเร็ววิดีโอ (Speed):</label>
        <select id="speed-style">
            <option value="0.25">0.25x (ช้ามากแบบสโลว์โมชัน)</option>
            <option value="0.5">0.5x (ช้า / คล้ายภาพยนตร์)</option>
            <option value="1" selected>1x (ความเร็วปกติ)</option>
            <option value="2">2x (เร็ว)</option>
            <option value="4">4x (เร็วมาก)</option>
        </select>

        <label>รูปแบบแผนที่:</label>
        <select id="map-style">
            <option value="satellite">🛰 แผนที่ดาวเทียม</option>
            <option value="standard">🗺 แผนที่ปกติ</option>
        </select>
    </div>

    <button class="action-btn" id="start-btn">▶ เล่น Flyover ปกติ</button>
    <button class="action-btn record-btn" id="record-btn">🎬 บันทึกวิดีโอแผนที่ล้วนๆ</button>
</div>

<div id="hud">
    <div class="hud-header">
        <h1>MY FLYOVER</h1>
        <p>Morning Run</p>
    </div>
    <div class="hud-stats">
        <div class="hud-item">
            <div class="hud-label">เพซ</div>
            <div class="hud-value" id="hud-pace">--:--</div>
            <div class="hud-unit">/กม.</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">ระดับความสูง</div>
            <div class="hud-value" id="hud-ele">--</div>
            <div class="hud-unit">ม.</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">ระยะทาง</div>
            <div class="hud-value" id="hud-dist">0.0</div>
            <div class="hud-unit">กม.</div>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="app.js"></script>
</body>
</html>
