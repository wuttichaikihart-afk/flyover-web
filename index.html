<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>3D Flyover (GPX Upload)</title>
    <meta name="viewport" content="initial-scale=1,maximum-scale=1,user-scalable=no">
    <link href="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.css" rel="stylesheet">
    <script src="https://unpkg.com/maplibre-gl@4.1.2/dist/maplibre-gl.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/togeojson/0.16.0/togeojson.min.js"></script>
    <script src="https://unpkg.com/@turf/turf@6/turf.min.js"></script>
    <style>
        body { margin: 0; padding: 0; font-family: -apple-system, sans-serif; background: #f0f0f0; overflow: hidden; }
        
        /* ให้แผนที่เต็มจอเสมอ วิดีโอจะอัดตามสัดส่วนจอ */
        #map { position: absolute; top: 0; bottom: 0; width: 100%; display: none; }
        
        #upload-panel {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 30px; border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1); text-align: center; z-index: 10;
            width: 80%; max-width: 400px;
        }
        
        #controls { 
            display: none; position: absolute; z-index: 10; 
            background: white; padding: 25px 20px 35px 20px; 
            bottom: 0; left: 0; width: 100%; box-sizing: border-box;
            border-radius: 24px 24px 0 0; 
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1); 
        }
        
        .action-btn {
            background: #2196F3; color: white; padding: 14px 24px; border: none;
            border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer;
            margin-top: 15px; width: 100%; display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .action-btn:hover { background: #1976D2; }

        .record-btn { background: #FF5A5F; }
        .record-btn:hover { background: #e04a50; }
        
        .style-selector { margin-top: 20px; }
        .style-selector label { font-size: 13px; font-weight: 600; color: #555; display: block; margin-bottom: 8px; }
        .style-selector select { 
            width: 100%; padding: 12px; border-radius: 10px; border: 1px solid #ddd; 
            font-size: 15px; margin-bottom: 15px; background: #f9f9f9; outline: none;
            -webkit-appearance: none; appearance: none;
        }

        /* แผงหน้าปัด ปรับให้รองรับจอมือถือแนวตั้งด้วย */
        #hud {
            display: none; 
            position: absolute; 
            top: 50px; 
            left: 50%; 
            transform: translateX(-50%); 
            color: white; 
            text-align: center;
            font-family: -apple-system, sans-serif;
            z-index: 10;
            width: 100%;
            max-width: 500px;
            text-shadow: 1px 1px 4px rgba(0,0,0,0.8), 0px 0px 10px rgba(0,0,0,0.5);
        }
        .hud-header h1 {
            margin: 0;
            font-size: 28px;
            font-weight: 900;
            letter-spacing: 2px;
            text-transform: uppercase;
        }
        .hud-header p {
            margin: 5px 0 20px 0;
            font-size: 16px;
            font-weight: 600;
        }
        .hud-stats {
            display: flex; 
            justify-content: space-between;
            padding: 0 20px;
        }
        .hud-item { 
            text-align: center; 
            flex: 1; 
        }
        .hud-label { 
            font-size: 13px; 
            font-weight: 700; 
            margin-bottom: 5px; 
        }
        .hud-value { 
            font-size: 38px; 
            font-weight: 900; 
            margin-bottom: 2px;
        }
        .hud-unit { 
            font-size: 14px; 
            font-weight: 700; 
        }
        
        #stop-btn {
            display: none;
            position: absolute;
            top: 20px;
            right: 20px;
            z-index: 20;
            background: rgba(20, 20, 20, 0.8);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            color: white;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 30px;
            padding: 10px 18px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        #stop-btn:hover {
            background: rgba(220, 40, 40, 0.85);
            border-color: rgba(255, 255, 255, 0.4);
        }

        /* ปรับขนาดตัวอักษรบนจอมือถือแนวตั้ง */
        @media (max-width: 600px) {
            #upload-panel { width: 85%; padding: 20px; }
            #hud { top: 40px; }
            .hud-header h1 { font-size: 24px; }
            .hud-header p { font-size: 14px; margin-bottom: 15px; }
            .hud-value { font-size: 28px; }
            .hud-label { font-size: 11px; }
            .hud-unit { font-size: 12px; }
            #stop-btn { top: 15px; right: 15px; left: auto; padding: 8px 14px; font-size: 13px; }
        }
    </style>
</head>
<body>

<div id="video-modal" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); z-index: 100; text-align: center; width: 80%; max-width: 350px;">
    <style>
        .social-btn {
            border: none; border-radius: 50%; width: 50px; height: 50px; 
            display: flex; align-items: center; justify-content: center; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.15); transition: transform 0.2s;
        }
        .social-btn:active { transform: scale(0.9); }
    </style>
    <p style="font-size: 13px; color: #777; margin: 15px 0 10px 0; font-weight: bold; text-transform: uppercase; letter-spacing: 1px;">แชร์ไปยังโซเชียล</p>
    <div style="display: flex; justify-content: center; gap: 15px; margin-bottom: 20px;">
        <!-- Facebook -->
        <button id="btn-share-fb" class="social-btn share-trigger" style="background: #1877F2;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M22.675 0h-21.35c-.732 0-1.325.593-1.325 1.325v21.351c0 .731.593 1.324 1.325 1.324h11.495v-9.294h-3.128v-3.622h3.128v-2.671c0-3.1 1.893-4.788 4.659-4.788 1.325 0 2.463.099 2.795.143v3.24l-1.918.001c-1.504 0-1.795.715-1.795 1.763v2.312h3.587l-.467 3.622h-3.12v9.293h6.116c.73 0 1.323-.593 1.323-1.325v-21.35c0-.732-.593-1.325-1.325-1.325z"/></svg>
        </button>
        <!-- Instagram -->
        <button id="btn-share-ig" class="social-btn share-trigger" style="background: #E4405F;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M12 2.163c3.204 0 3.584.012 4.85.07 3.252.148 4.771 1.691 4.919 4.919.058 1.265.069 1.645.069 4.849 0 3.205-.012 3.584-.069 4.849-.149 3.225-1.664 4.771-4.919 4.919-1.266.058-1.644.07-4.85.07-3.204 0-3.584-.012-4.849-.07-3.26-.149-4.771-1.699-4.919-4.92-.058-1.265-.07-1.644-.07-4.849 0-3.204.013-3.583.07-4.849.149-3.227 1.664-4.771 4.919-4.919 1.266-.057 1.645-.069 4.849-.069zm0-2.163c-3.259 0-3.667.014-4.947.072-4.358.2-6.78 2.618-6.98 6.98-.059 1.281-.073 1.689-.073 4.948 0 3.259.014 3.668.072 4.948.2 4.358 2.618 6.78 6.98 6.98 1.281.058 1.689.072 4.948.072 3.259 0 3.668-.014 4.948-.072 4.354-.2 6.782-2.618 6.979-6.98.059-1.28.073-1.689.073-4.948 0-3.259-.014-3.667-.072-4.947-.196-4.354-2.617-6.78-6.979-6.98-1.281-.059-1.69-.073-4.949-.073zm0 5.838c-3.403 0-6.162 2.759-6.162 6.162s2.759 6.163 6.162 6.163 6.162-2.759 6.162-6.163c0-3.403-2.759-6.162-6.162-6.162zm0 10.162c-2.209 0-4-1.79-4-4 0-2.209 1.791-4 4-4s4 1.791 4 4c0 2.21-1.791 4-4 4zm6.406-11.845c-.796 0-1.441.645-1.441 1.44s.645 1.44 1.441 1.44c.795 0 1.439-.645 1.439-1.44s-.644-1.44-1.439-1.44z"/></svg>
        </button>
        <!-- TikTok -->
        <button id="btn-share-tiktok" class="social-btn share-trigger" style="background: #000000;">
            <svg viewBox="0 0 24 24" width="24" height="24" fill="white"><path d="M12.525.02c1.31-.02 2.61-.01 3.91-.02.08 1.53.63 3.09 1.75 4.17 1.12 1.11 2.7 1.62 4.24 1.79v4.03c-1.44-.05-2.89-.35-4.2-.97-.57-.26-1.1-.59-1.62-.93-.01 2.92.01 5.84-.02 8.75-.08 2.23-1.15 4.38-2.9 5.76-1.99 1.57-4.75 1.94-7.07 1.05-2.2-.84-3.87-2.73-4.43-5.02-.57-2.31-.05-4.85 1.34-6.73 1.37-1.85 3.58-2.92 5.86-3.03v4.09c-1.18.06-2.34.61-3.15 1.53-.78.89-1.1 2.14-.86 3.3.26 1.25 1.17 2.32 2.36 2.76 1.37.52 2.99.3 4.1-.64 1.07-.91 1.63-2.3 1.63-3.71.02-5.41.01-10.83.01-16.24z"/></svg>
        </button>
        <!-- X/Twitter -->
        <button id="btn-share-x" class="social-btn share-trigger" style="background: #14171A;">
            <svg viewBox="0 0 24 24" width="20" height="20" fill="white"><path d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z"/></svg>
        </button>
    </div>
    
    <div style="border-top: 1px solid #eee; margin: 15px 0;"></div>

    <button id="btn-save-video" class="action-btn" style="background: #f0f0f0; color: #333; margin-top: 10px; font-weight: bold;">💾 เซฟลงเครื่อง (Save)</button>
    <button id="btn-close-modal" class="action-btn" style="background: transparent; color: #999; margin-top: 5px; box-shadow: none;">ปิดหน้าต่าง</button>
</div>

<button id="stop-btn">✕ หยุด / ย้อนกลับ</button>

<div id="upload-panel">
    <h2>อัปโหลดเส้นทางวิ่งของคุณ</h2>
    <p>รองรับไฟล์ .gpx (ส่งออกจาก Garmin Connect ได้เลย)</p>
    <input type="file" id="gpx-input" accept=".gpx">
</div>

<div id="controls">
    <h3 id="run-title" style="margin-top:0;">My Run</h3>
    
    <div class="style-selector">
        <label>ความเร็ววิดีโอ (Speed):</label>
        <select id="speed-style">
            <option value="0.25">0.25x (ช้ามากแบบสโลว์โมชัน)</option>
            <option value="0.5">0.5x (ช้า / คล้ายภาพยนตร์)</option>
            <option value="1" selected>1x (ความเร็วปกติ)</option>
            <option value="2">2x (เร็ว)</option>
            <option value="4">4x (เร็วมาก)</option>
        </select>

        <label>รูปแบบแผนที่:</label>
        <select id="map-style">
            <option value="satellite">🛰 แผนที่ดาวเทียม</option>
            <option value="standard">🗺 แผนที่ปกติ</option>
        </select>
    </div>

    <button class="action-btn" id="start-btn">▶ เล่น Flyover ปกติ</button>
    <button class="action-btn record-btn" id="record-btn">🎬 บันทึกวิดีโอแผนที่ล้วนๆ</button>
</div>

<div id="hud">
    <div class="hud-header">
        <h1>MY FLYOVER</h1>
        <p>Morning Run</p>
    </div>
    <div class="hud-stats">
        <div class="hud-item">
            <div class="hud-label">เพซ</div>
            <div class="hud-value" id="hud-pace">--:--</div>
            <div class="hud-unit">/กม.</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">ระดับความสูง</div>
            <div class="hud-value" id="hud-ele">--</div>
            <div class="hud-unit">ม.</div>
        </div>
        <div class="hud-item">
            <div class="hud-label">ระยะทาง</div>
            <div class="hud-value" id="hud-dist">0.0</div>
            <div class="hud-unit">กม.</div>
        </div>
    </div>
</div>

<div id="map"></div>

<script src="app.js"></script>
</body>
</html>
